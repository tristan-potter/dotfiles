# https://sw.kovidgoyal.net/kitty/overview/#configuring-kitty

# include solarized_dark_high_contrast.conf
include themer-dark.conf

## ----------------------------
## Font
## ----------------------------

font_family SauceCodePro Nerd Font Mono
bold_font SauceCodePro Nerd Font Mono Bold
italic_font SauceCodePro Nerd Font Mono Italic
bold_italic_font SauceCodePro Nerd Font Mono Bold Italic
font_size 13

modify_font underline_position 5
modify_font underline_thickness 100%

## ----------------------------
## Cursor
## ----------------------------

cursor_blink_interval 0

## ----------------------------
## Window
## ----------------------------

# The window padding (in pts) (blank area between the text and the window
# border). A single value sets all four sides. Two values set the vertical and
# horizontal sides. Three values set top, horizontal and bottom. Four values
# set top, right, bottom and left.
window_padding_width 10 10

# Hide the window decorations (title-bar and window borders) with yes. On
# macOS, titlebar-only and titlebar-and-corners can be used to only hide the
# titlebar and the rounded corners. Whether this works and exactly what effect
# it has depends on the window manager/operating system. Note that the effects
# of changing this option when reloading config are undefined. When using
# titlebar-only, it is useful to also set window_margin_width and
# placement_strategy to prevent the rounded corners from clipping text. Or use
# titlebar-and-corners. Default is no.
hide_window_decorations no

# Use the macOS traditional full-screen transition, that is faster, but less
# pretty.
macos_traditional_fullscreen yes

# Control where the window title is displayed on macOS. A value of window will
# show the title of the currently active window at the top of the macOS window.
# A value of menubar will show the title of the currently active window in the
# macOS global menu bar, making use of otherwise wasted space. A value of all
# will show the title in both places, and none hides the title. See
# macos_menubar_title_max_length for how to control the length of the title in
# the menu bar.
macos_show_window_title_in all

# The maximum number of characters from the window title to show in the macOS
# global menu bar. Values less than one means that there is no maximum limit.
macos_menubar_title_max_length 0

# The color of the kitty window’s titlebar on macOS. A value of system means to
# use the default system color, light or dark can also be used to set it
# explicitly. A value of background means to use the background color of the
# currently active window and finally you can use an arbitrary color, such as
# #12af59 or red. WARNING: This option works by using a hack when arbitrary
# color (or background) is configured, as there is no proper Cocoa API for it.
# It sets the background color of the entire window and makes the titlebar
# transparent. As such it is incompatible with background_opacity. If you want
# to use both, you are probably better off just hiding the titlebar with
# hide_window_decorations.
macos_titlebar_color system

# If enabled, the OS Window size will be remembered so that new instances of
# kitty will have the same size as the previous instance. If disabled, the OS
# Window will initially have size configured by initial_window_width/height, in
# pixels. You can use a suffix of “c” on the width/height values to have them
# interpreted as number of cells instead of pixels.
remember_window_size  yes
initial_window_width  1000
initial_window_height 650

## ----------------------------
## Other
## ----------------------------
enable_audio_bell no
